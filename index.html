<script>
(function(){
  if(window.__AUTO_CADASTRO_PMR__) return;
  window.__AUTO_CADASTRO_PMR__ = true;

  /* Aguarda o sistema carregar */
  function aplicar(){
    if(typeof importarParaLancamentoProvisorio !== "function"){
      setTimeout(aplicar, 300);
      return;
    }

    /* Sobrescreve a função para cadastrar pombos automaticamente */
    window.importarParaLancamentoProvisorio = function(){
      if(!pmrDadosImportadosAtual || !pmrDadosImportadosAtual.pombos.length) return;

      if(!provaAtual){
        const ano = document.getElementById("pmrAno").value;
        const num = document.getElementById("pmrNum").value;
        const nome = document.getElementById("pmrNomeConcurso").value;
        if(!ano || ano === "0") return alert("Selecione um concurso na Aba 1 primeiro!");
        carregarLancamentosProva(ano, num, nome);
      }

      const curso = getCursoAtual();
      const socioID = pmrDadosImportadosAtual.socioID || "";

      let importadosCont = 0;
      let cadastradosNovos = 0;
      let jaExistiam = 0;
      const listaNovos = [];
      const listaJaExistiam = [];

      pmrDadosImportadosAtual.pombos.forEach(p => {
        /* Verifica se o pombo já existe no cadastro */
        let pCad = pombosSalvos.find(x => x.anilha === p.anilha);

        if(pCad){
          /* Pombo JÁ existe */
          jaExistiam++;
          listaJaExistiam.push(p.anilha);
        } else {
          /* Pombo NÃO existe - CADASTRA AUTOMATICAMENTE */
          const novoPombo = {
            anilha: p.anilha,
            assoc: "11",
            colec: "33",
            numero: socioID,
            sexo: "????"  /* Sexo indefinido - operador edita depois */
          };
          pombosSalvos.push(novoPombo);
          cadastradosNovos++;
          listaNovos.push(p.anilha);
          pCad = novoPombo;
        }

        /* Adiciona o lançamento (se ainda não estiver na prova) */
        if(!lancamentos.some(l => l.anilha === p.anilha)){
          lancamentos.push({
            anilha: p.anilha,
            assoc: pCad.assoc,
            colec: pCad.colec,
            concNum: socioID,
            sexo: pCad.sexo,
            chegada: p.hora,
            dias: "1",
            partida: curso ? curso.horaSolta : "",
            tMorto: curso ? (curso.tm1 || "00:00:00") : "00:00:00",
            correcao: "0",
            dataIni: curso ? (curso.data || "") : "",
            horaIni: curso ? (curso.horaSolta || "") : "",
            dataFim: curso ? (curso.data || "") : "",
            horaFim: p.hora,
            distancia: "0,0",
            media: "0,0000",
            tempoVoo: "",
            pmrProvisorio: true
          });
          importadosCont++;
        }
      });

      /* Salva os pombos novos cadastrados */
      if(cadastradosNovos > 0){
        salvarPombos();
        atualizarTabelaPombos();
      }

      salvarLancamentosProvaAtual();
      atualizarListaLancamentos();
      if(typeof atualizarTabelaAuditoriaPMR === "function") atualizarTabelaAuditoriaPMR();

      /* Monta mensagem de resumo bonita */
      let msg = "⚡ IMPORTAÇÃO CONCLUÍDA!\n\n";
      msg += "📊 RESUMO:\n";
      msg += "━━━━━━━━━━━━━━━━━━━━\n";
      msg += "✔ Total importado: " + importadosCont + " pombos\n";
      msg += "🟢 Já cadastrados: " + jaExistiam + " pombos\n";
      msg += "🆕 NOVOS cadastrados: " + cadastradosNovos + " pombos\n";
      msg += "━━━━━━━━━━━━━━━━━━━━\n";

      if(cadastradosNovos > 0){
        msg += "\n🆕 NOVOS POMBOS CADASTRADOS:\n";
        msg += "(vinculados ao sócio " + socioID + ")\n\n";
        listaNovos.forEach(a => msg += "• " + a + "\n");
        msg += "\n⚠️ ATENÇÃO: Os novos pombos foram cadastrados com sexo '????'.\n";
        msg += "Edite depois no menu 🕊️ Pombos para colocar o sexo correto!";
      }

      alert(msg);

      closeWin("winRemoteClock");
      openWin("winLancamento");
    };

    console.log("✅ Auto-cadastro de pombos PMR ativado!");
  }

  if(document.readyState === "complete" || document.readyState === "interactive"){
    setTimeout(aplicar, 500);
  } else {
    window.addEventListener("load", () => setTimeout(aplicar, 500));
  }
})();
</script>

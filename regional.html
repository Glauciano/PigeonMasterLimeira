<style>

body{font-family:Tahoma,"MS Sans Serif",Arial,sans-serif;font-size:11px;background:#bfbfbf;color:#000;overflow:hidden}

.row{display:flex;align-items:center;margin-bottom:4px;min-height:22px;flex-wrap:wrap;gap:2px}

.btn-bar{display:flex;justify-content:center;gap:3px;margin-top:8px;flex-wrap:wrap}
.classic-btn{min-width:58px;height:42px;background:#e5e5e5;border:2px outset #d0d0d0;font-size:11px;cursor:pointer}
.classic-table{border-collapse:collapse;background:#fff;font-size:11px;width:100%}

<body>

        <h1 style="color:#800000;">CAMPEONATO REGIONAL</h1>
        <p>Sistema independente de apuração.</p>

    <!-- (Aqui o código carrega todas as divs de janelas winLancamento, winPombos, etc.) -->
  </div>

<script>
// =========================================================
// 🛡️ ISOLAMENTO PROFISSIONAL - CAMPEONATO REGIONAL
// =========================================================
const STORE = {
  pombos: "reg_pombos",
  concorrentes: "reg_concorrentes",
  cursos: "reg_cursos",
  lancamentos: "reg_lancamentos",
  classificacoes: "reg_classificacoes",
  param: "reg_param"
};

let pombosSalvos=[], concorrentesSalvos=[], cursosSalvos=[], todosLancamentos={}, classificacoesSalvas={}, param={max:25,top:6,p:3,e:3};

// FUNÇÕES DE PERSISTÊNCIA FIEL
function saveLS(k,v){localStorage.setItem(k,JSON.stringify(v))}
function loadLS(k,fb){try{const d=localStorage.getItem(k);return d?JSON.parse(d):fb}catch(e){return fb}}

function salvarPombos(){saveLS(STORE.pombos,pombosSalvos)}
function salvarConcorrentes(){saveLS(STORE.concorrentes,concorrentesSalvos)}
function salvarCursos(){saveLS(STORE.cursos,cursosSalvos)}
function salvarLancamentos(){saveLS(STORE.lancamentos,todosLancamentos)}
function salvarClassificacoes(){saveLS(STORE.classificacoes,classificacoesSalvas)}

// (Aqui você cola todas as funções de cálculo, Vincenty, Tabelas, etc. 
// do seu index.html original para manter a lógica 1000% igual)

function setStatus(t){document.getElementById("statusBar").textContent="REGIONAL | "+t}

window.onload = function() {
    carregarStorage();
    setStatus("Banco de Dados Regional Ativado.");
};
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBJrFD_QVxmw8DjWtDouoUApaktJ_iWJbU",
  authDomain: "pigeon-master-limeira.firebaseapp.com",
  projectId: "pigeon-master-limeira",
  storageBucket: "pigeon-master-limeira.firebasestorage.app",
  messagingSenderId: "699040898930",
  appId: "1:699040898930:web:8ab9707c918d7f67e687eb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// GRAVAÇÃO FIEL NA GAVETA 'MASTER_REGIONAL'
async function sincronizarNuvemRegional() {
    const backupRegional = {
        pombos: window.pombosSalvos,
        concorrentes: window.concorrentesSalvos,
        cursos: window.cursosSalvos,
        lancamentos: window.todosLancamentos,
        classificacoes: window.classificacoesSalvas,
        param: window.param,
        ultima_atualizacao: new Date().toISOString()
    };
    try {
        await setDoc(doc(db, "SISTEMA_LIMEIRA", "MASTER_REGIONAL"), backupRegional);
    } catch (e) { console.error("Erro nuvem regional:", e); }
}

function carregarNuvemRegional() {
    onSnapshot(doc(db, "SISTEMA_LIMEIRA", "MASTER_REGIONAL"), (doc) => {
        const dados = doc.data();
        if (dados) {
            window.pombosSalvos = dados.pombos;
            window.concorrentesSalvos = dados.concorrentes;
            window.cursosSalvos = dados.cursos;
            window.todosLancamentos = dados.lancamentos;
            window.classificacoesSalvas = dados.classificacoes;
            window.param = dados.param;
            if(typeof window.atualizarTabelaPombos === 'function') window.atualizarTabelaPombos();
        }
    });
}

// Gancho para o Regional
const originalSaveLS = window.saveLS;
window.saveLS = function(k, v) {
    if(typeof originalSaveLS === "function") originalSaveLS(k, v);
    if(k && k.startsWith("reg_")) sincronizarNuvemRegional();
};

window.addEventListener('load', carregarNuvemRegional);
</script>
